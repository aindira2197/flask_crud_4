<!DOCTYPE html>
<html>
<head>
    <title>Create Note</title>
</head>
<body>

    <h1>Add Note</h1>

    <form method="POST">

        <input
            type="text"
            name="title"
            placeholder="Title"
        >

        <br><br>

        <textarea
            name="content"
            placeholder="Write note..."
            rows="10"
            cols="40"
        ></textarea>

        <br><br>

        <button type="submit">
            Save
        </button>

    </form>

</body>
</html>
